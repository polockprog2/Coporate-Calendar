<div class="h-screen flex bg-gray-50">
  <!-- Sidebar -->
  <app-sidebar
    [categories]="mockCategories"
    [labels]="mockLabels"
    [selectedCategory]="selectedCategory"
    [searchQuery]="searchQuery"
    (categorySelect)="selectedCategory = $event; updateFilteredEvents()"
    (addEvent)="handleAddEvent('event')"
    (addTask)="handleAddEvent('task')"
    (addVenue)="handleAddEvent('venue')"
    (showProfile)="isProfileModalOpen = true"
    (showSettings)="isSettingsModalOpen = true"
    (searchChange)="searchQuery = $event; updateFilteredEvents()"
  ></app-sidebar>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <app-calendar-header
      [currentDate]="currentDate"
      [view]="view"
      (viewChange)="view = $event"
      (navigate)="handleNavigate($event)"
      (today)="handleToday()"
    ></app-calendar-header>

    <!-- Calendar View -->
    <div class="flex-1 overflow-auto">
      <app-month-view
        *ngIf="view === 'month'"
        [currentDate]="currentDate"
        [events]="filteredEvents"
        [categories]="mockCategories"
        (eventClick)="handleEventClick($event)"
        (dateClick)="handleDateClick($event)"
      ></app-month-view>

      <app-week-view
        *ngIf="view === 'week'"
        [currentDate]="currentDate"
        [events]="filteredEvents"
        [categories]="mockCategories"
        (eventClick)="handleEventClick($event)"
        (eventMoved)="handleEventMoved($event)"
        (eventCreated)="handleEventCreated($event)"
      ></app-week-view>

      <app-day-view
        *ngIf="view === 'day'"
        [currentDate]="currentDate"
        [events]="filteredEvents"
        [categories]="mockCategories"
        (eventClick)="handleEventClick($event)"
      ></app-day-view>

      <app-year-view
        *ngIf="view === 'year'"
        [currentDate]="currentDate"
        [events]="filteredEvents"
        [categories]="mockCategories"
        (dateClick)="handleDateClick($event)"
      ></app-year-view>

      <app-agenda-view
        *ngIf="view === 'agenda'"
        [events]="filteredEvents"
        [categories]="mockCategories"
        (eventClick)="handleEventClick($event)"
        (toggleTask)="handleToggleTask($event)"
      ></app-agenda-view>
    </div>
  </div>

  <!-- Modals -->
  <app-event-modal
    [isOpen]="isEventModalOpen"
    [event]="selectedEvent"
    [categories]="mockCategories"
    [selectedDate]="selectedDate"
    [type]="modalType"
    (close)="isEventModalOpen = false; selectedEvent = null; selectedDate = undefined"
    (save)="handleSaveEvent($event)"
  ></app-event-modal>

  <app-event-details-modal
    [isOpen]="isEventDetailsModalOpen"
    [event]="selectedEvent"
    [categories]="mockCategories"
    (close)="isEventDetailsModalOpen = false; selectedEvent = null"
    (edit)="handleEditEvent($event)"
    (delete)="handleDeleteEvent($event)"
  ></app-event-details-modal>

  <app-user-profile-modal
    [isOpen]="isProfileModalOpen"
    (close)="isProfileModalOpen = false"
  ></app-user-profile-modal>

  <app-settings-modal
    [isOpen]="isSettingsModalOpen"
    [settings]="settings"
    (close)="isSettingsModalOpen = false"
    (save)="handleSettingsSave($event)"
  ></app-settings-modal>

  <!-- Toast Container -->
  <app-toast-container></app-toast-container>
</div>
